# The main pipeline for VG_First_DAB_WithParam

resources:
  pipelines:
    VG_First_DAB_WithParam_etl:
      name: VG_First_DAB_WithParam_etl
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      root_path: "../src/VG_First_DAB_WithParam_etl"

      libraries:
        - glob:
            include: ../src/VG_First_DAB_WithParam_etl/transformations/**

      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - --editable ${workspace.file_path}
